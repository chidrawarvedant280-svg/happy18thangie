<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost in the Sky · Angeline 2026</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #152642;
      background: radial-gradient(circle at 20% 20%, #E1F0FF 0%, #F8FBFF 55%, #F0F7FF 100%);
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid rgba(21, 38, 66, 0.08);
      border-radius: 24px;
      padding: 2.25rem 2rem;
      text-align: center;
      box-shadow: 0 14px 38px rgba(21, 38, 66, 0.08);
    }
    .pill {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background: #E1F0FF;
      color: #1D6FD1;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.65rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.55rem; }
    p { font-size: 0.95rem; color: #4A648C; line-height: 1.6; margin-bottom: 1.5rem; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #152642;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 0.82rem 1.55rem;
      border-radius: 9999px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    a:hover { background: #1D6FD1; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <span class="pill">404 · Wrong Cloud</span>
    <h1>Whoa there, Angie!</h1>
    <p>Looks like this sky lane drifted off course. Tap below to head straight back to your birthday celebration.</p>
    <a href="./">Return to Angeline’s Site →</a>
  </div>
</body>
</html>
